sonar.projectKey=philliplbryant_BentoFX
sonar.organization=philliplbryant
sonar.projectName=BentoFX

# The remaining properties are configured in SonarQube Cloud or as secrets in
# GitHub. To run SonarQube analysis in IntelliJ, configure
# `File | Settings | SonarQube for IDE` by adding
# `Connections to SonarQube (Cloud)`
#
# The CLI scanner treats every file as production source unless told otherwise.
# Without the split below it counted the test sources in coverage calculations.
#
# The SonarQube Gradle plugin isn't used here because it fails under Isolated
# Projects. The trade is deliberate: the CLI scanner can't report branch
# coverage, but using the plugin instead would cost Gradle compatibility and
# might break the build on Gradle 10+.
sonar.sources=.
sonar.inclusions=**/src/main/**

sonar.tests=.
sonar.test.inclusions=**/src/test/**,\
  **/src/it/**,\
  **/src/itp/**,\
  **/src/itg/**,\
  **/src/testFixtures/**

# ':report-aggregation' produces these, not each module's test task, so they have
# to be named. A missing one is tolerated.
sonar.coverage.jacoco.xmlReportPaths=\
  report-aggregation/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml,\
  report-aggregation/build/reports/jacoco/integrationTestCodeCoverageReport/integrationTestCodeCoverageReport.xml,\
  report-aggregation/build/reports/jacoco/integrationTestGraphicalCodeCoverageReport/integrationTestGraphicalCodeCoverageReport.xml,\
  report-aggregation/build/reports/jacoco/integrationTestParallelCodeCoverageReport/integrationTestParallelCodeCoverageReport.xml

# No 'sonar.exclusions', so 'core' and 'demos/basic' are analyzed and their
# findings show. What keeps that backlog from failing the gate is the New Code
# definition set in SonarQube Cloud, not this file - with none set, every file
# counts as new and the gate fails on the backlog.

# Sonar's web CSS analyzer doesn't know JavaFX pseudo-classes like ':pressed' or
# ':collapsed', so it raised 'Unknown pseudo-class selector' 36 times and failed
# the gate. No stylesheet edit would satisfy the rule. Only S4659 is ignored, not
# the folder: 'css:S4658' (empty blocks) and 'css:S4666' (duplicate selectors)
# mean the same thing in JavaFX as on the web and stay reported.
sonar.issue.ignore.multicriteria=javafxPseudoClasses
sonar.issue.ignore.multicriteria.javafxPseudoClasses.ruleKey=css:S4659
sonar.issue.ignore.multicriteria.javafxPseudoClasses.resourceKey=**/*.css
