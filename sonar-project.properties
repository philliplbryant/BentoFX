sonar.projectKey=philliplbryant_BentoFX
sonar.organization=philliplbryant
sonar.projectName=BentoFX

# Kept out of analysis so the quality gate reflects code that has tests. Neither
# module has any, so their findings would be a standing backlog rather than a
# signal about the change under review.
#
# Narrower than the `exclude` list in `qodana.yaml`, which also excludes
# `demos/persistence/src/main/resources` because Qodana fails on it. Sonar has
# not, so that path stays in scope here.
# TODO BENTO-13: Remove these exclusions and resolve the findings they hide.
sonar.exclusions=core/**,demos/basic/**

# The remaining properties are configured in SonarQube Cloud or as secrets in
# GitHub. To run SonarQube analysis in IntelliJ, configure
# `File | Settings | SonarQube for IDE` by adding
# `Connections to SonarQube (Cloud)`
