sonar.projectKey=philliplbryant_BentoFX
sonar.organization=philliplbryant
sonar.projectName=BentoFX

sonar.sources=.
sonar.java.binaries=**/build/classes
sonar.sourceEncoding=UTF-8

# TODO BENTO-13: Enable analysis on these modules. This file is read only by the
# CLI scanner, so SonarQube for IDE keeps flagging the modules in IntelliJ until
# the same two directories are excluded there as well - Settings > Tools >
# SonarQube for IDE > File Exclusions, which lands in the gitignored
# .idea/sonarlint.xml. Clearing this line means clearing those too.
sonar.exclusions=core/**,demos/basic/**

# java:S3577 checks test class names against a regular expression that accepts
# the Test and IT suffixes but not FT or ITP, which are this project's
# functional and parallel-integration suites. The suffixes are the convention
# here, so the rule is silenced on those files rather than the files renamed to
# suit it.
#
# One criterion per suffix: resourceKey takes an Ant-style path, not a regular
# expression, so there is no way to fold them into one - and *IT.java would not
# not have covered *ITP.java anyway.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S3577
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*FT.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S3577
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*IT.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S3577
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*ITP.java
