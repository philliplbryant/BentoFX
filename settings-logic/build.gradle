plugins {
    id 'groovy-gradle-plugin'
    id 'java-gradle-plugin'
}

description = 'Used to discover projects and decide which projects participate ' +
        'in the aggregation project. Runs before Gradle creates projects.'

gradlePlugin {
    plugins {
        reportAggregationProjectsSettingsPlugin {
            id = 'software.report.aggregated-projects'
            implementationClass = 'software.coley.gradle.plugin.report.ReportAggregationSettingsPlugin'
        }
    }
}
