version: "1.0"

# Pinned to match the qodana-action release in .github/workflows/qodana.yml
# (v2026.2.x); update both together.
linter: jetbrains/qodana-jvm-community:2026.2

projectJDK: "21"

profile:
  name: qodana.starter

# TODO BENTO-13: Reinstate 'failThreshold: 0' once a 'qodana.sarif.json' baseline
# is committed, so the gate holds at zero *new* problems.
#
# 'core' and 'demos/basic' are analyzed now and carry a pre-existing backlog. With
# no threshold they report without failing, and the workflow's SARIF upload still
# puts every problem in the GitHub Security tab.

coverage:
  reportProblems: false

exclude:
  - name: All
    paths:
      - build
