version: "1.0"

# Pinned to match the qodana-action release in .github/workflows/qodana.yml
# (v2026.2.x); update both together.
linter: jetbrains/qodana-jvm-community:2026.2

projectJDK: "21"

profile:
  name: qodana.starter

# Baseline captures the pre-existing backlog in 'core' and 'demos/basic'; the
# gate fails on any *new* problem beyond it.
baseline: qodana.sarif.json
failThreshold: 0

coverage:
  reportProblems: false

exclude:
  - name: All
    paths:
      - build
