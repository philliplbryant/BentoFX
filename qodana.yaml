version: "1.0"

linter: jetbrains/qodana-jvm

projectJDK: "21"

profile:
  name: qodana.starter

# Fails the build on any reported problem. The analysis reports none as of
# 2026-09-01, so this holds the line at zero rather than allowing a budget.
#
# If a legitimate finding has to be tolerated later, suppress it at the site with
# a comment explaining why, rather than raising this number - a count lets an
# unrelated new problem through in place of the one it was meant to allow. A
# committed 'qodana.sarif.json' baseline is the better mechanism if the count
# ever grows past what site suppressions can carry.
failThreshold: 0

coverage:
  reportProblems: false

exclude:
  - name: All
    paths:
      - build
      # TODO BENTO-13: Enable analysis on these modules
      - core
      - demos/basic
      - demos/persistence/src/main/resources
