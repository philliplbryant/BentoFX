plugins {
    alias(libs.plugins.javafx)
    id 'bento.project.project-convention'
    id 'bento.release.publish-convention'
    id 'bento.test.functional-test-suite'
}

description = "BentoFX Persistence Core"

/**
 * Checks that the Javadoc in this module is well-formed - unterminated
 * {@code @link} tags, bad references, broken HTML - and fails the build when it
 * is not. The shared convention sets {@code Xdoclint:none}, which is how an
 * unterminated {@code @link} that swallowed the rest of a comment in
 * {@link software.coley.bentofx.persistence.core.impl.DockingLayoutStateRestorer}
 * went unnoticed here.
 *
 * <p>Overridden per-module rather than in
 * {@code bento.project.project-convention} because the docking framework at the
 * repository root - {@code core/}, not this module - has eight pre-existing
 * {@code <p/>} errors that doclint rejects, and that module is not this one's to
 * change.</p>
 *
 * <p>The {@code missing} group stays off: this checks the Javadoc that exists
 * rather than demanding a comment on every member.</p>
 *
 * TODO BENTO-13: Move this into the project convention once the JavaDocs in the
 *  root {@code core/} module are fixed.
 */
javadoc {
    options {
        addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}

/**
 * Lints Javadoc that the published {@code javadoc} task cannot see.
 *
 * <p>That task reads public and protected members only, so it is blind to a
 * malformed comment on a package-private class - which is exactly where the
 * unterminated {@code @link} in
 * {@link software.coley.bentofx.persistence.core.impl.DockingLayoutStateRestorer} was
 * found. This task lints the same source at
 * {@link org.gradle.external.javadoc.JavadocMemberLevel#PRIVATE} and throws its
 * output away; it exists to fail, not to publish. Wired into {@code check} so an
 * ordinary build catches it.</p>
 */
def javadocLint = tasks.register('javadocLint', Javadoc) {
    description = 'Fails when any Javadoc in this module is malformed, including on non-public members.'
    group = 'verification'

    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    destinationDir = layout.buildDirectory.dir('docs/javadoc-lint').get().asFile

    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.named('check') {
    dependsOn javadocLint
}

javafx {
    modules = ['javafx.base', 'javafx.controls', 'javafx.graphics']
    configurations = ['api','functionalTestImplementation']
}

dependencies {
    api projects.core

    implementation libs.slf4j.api

    testImplementation testFixtures(projects.persistence.testFixtures)

    functionalTestImplementation testFixtures(projects.persistence.testFixtures)

    functionalTestRuntimeOnly libs.slf4j.simple
}
