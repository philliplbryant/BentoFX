plugins {
    id 'bento.project.project-convention'
    id 'bento.test.functional-test-suite'
    id 'bento.test.integration-test-parallel-suite'
    id 'bento.test.integration-test-suite'
    id 'bento.report.test-aggregation'
    id 'bento.report.jacoco-aggregation'
}

description = 'Aggregated reports for BentoFX library modules.'

def reportAggregationProjects = gradle.extensions
        .getByName('reportAggregationProjects')
        .projectPaths


dependencies {
    reportAggregationProjects.get().each { String projectPath ->
        def projectToReport = project(projectPath)
        jacocoAggregation(projectToReport)
        testReportAggregation(projectToReport)
    }
}

tasks.withType(Jar).configureEach {
    enabled = false
}
