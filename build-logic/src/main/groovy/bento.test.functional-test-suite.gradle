import software.coley.gradle.buildservice.SimpleBuildService
import software.coley.gradle.lifecycle.TestLifecycle

import static software.coley.gradle.conventions.test.TestSuites.FUNCTIONAL_TEST
import static software.coley.gradle.lifecycle.BuildLifecycle.ALL_CLASSES_TASK_NAME
import static software.coley.gradle.lifecycle.TestLifecycle.CHECK_FUNCTIONAL_TASK_NAME

plugins {
    id 'jacoco'
    id 'bento.project.build-lifecycle'
    id 'bento.test.test-lifecycle'
    id 'com.autonomousapps.dependency-analysis'
    id 'jvm-test-suite'
}

def nonParallelBuildService =
        gradle.sharedServices.registerIfAbsent('nonParallelBuildService', SimpleBuildService) {
            maxParallelUsages = 1
        }

def testSuiteName = FUNCTIONAL_TEST
def testSuiteDirName = 'ft'
def testSuiteTestSuffix = 'FT'
def jacocoEnabled = TestLifecycle.enableJacoco(project)
def checkFunctionalTask = tasks.named(CHECK_FUNCTIONAL_TASK_NAME)
def allClassesTask = tasks.named(ALL_CLASSES_TASK_NAME)

testing {
    suites {
        register(testSuiteName, JvmTestSuite) {
            dependencies {
                implementation project()
            }

            sources {
                java {
                    setSrcDirs(["src/${testSuiteDirName}/java"])
                }
                resources {
                    setSrcDirs(["src/${testSuiteDirName}/resources"])
                }
            }

            targets.configureEach {
                testTask.configure {
                    filter {
                        includeTestsMatching "*${testSuiteTestSuffix}"
                        includeTestsMatching "*${testSuiteTestSuffix}\$*"
                        failOnNoMatchingTests = false
                    }

                    def headless = project.providers.gradleProperty('headless').orNull
                    if (headless == 'true') {
                        systemProperty 'prism.order', 'sw'
                        systemProperty 'prism.text', 't2k'
                        systemProperty 'testfx.headless', 'true'
                        systemProperty 'testfx.robot', 'glass'
                    }
                    usesService(nonParallelBuildService)

                    maxHeapSize = '2g'
                    modularity.inferModulePath.set(false)
                    jvmArgs = (jvmArgs ?: []).findAll { !it.contains('--module-path') }
                }
            }
        }
    }
}

def functionalTestTask = tasks.named('functionalTest', Test)
def functionalTestClassesTask = tasks.named('functionalTestClasses')

dependencies {
    def versionCatalog = versionCatalogs.named('libs')
    add("${testSuiteName}CompileOnly", versionCatalog.findBundle('annotations').get())
    add("${testSuiteName}Implementation", versionCatalog.findBundle('test-libraries').get())
    add("${testSuiteName}RuntimeOnly", versionCatalog.findBundle('test-runtime').get())
}

dependencyAnalysis {
    abi {
        exclusions {
            excludeSourceSets(testSuiteName)
        }
    }
    // Test source set analysis broken by Kotlin 2.0.20:
    // https://github.com/autonomousapps/dependency-analysis-gradle-plugin/issues/1239
    issues {
        ignoreSourceSet(testSuiteName)
    }
}

functionalTestTask.configure {
    def suiteSourceSet = sourceSets.named(testSuiteName).get()
    testClassesDirs = suiteSourceSet.output.classesDirs
    classpath = suiteSourceSet.runtimeClasspath
    modularity.inferModulePath.set(false)
}

allClassesTask.configure {
    dependsOn(functionalTestClassesTask)
}

def jacocoExecutionData = functionalTestTask.map { testTask ->
    testTask.extensions.getByType(JacocoTaskExtension).destinationFile
}

def jacocoFunctionalTestReportTask = tasks.register('jacocoFunctionalTestReport', JacocoReport) { reportTask ->
    reportTask.group = 'verification'
    reportTask.description = 'Generates JaCoCo coverage report for the functional test task.'
    reportTask.dependsOn(functionalTestTask)
    reportTask.executionData(jacocoExecutionData)
    reportTask.onlyIf { jacocoExecutionData.get().exists() }
    reportTask.sourceSets(sourceSets.main)
    reportTask.reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

checkFunctionalTask.configure {
    dependsOn(functionalTestTask)
    if (jacocoEnabled) {
        dependsOn(jacocoFunctionalTestReportTask)
    }
}
