import static org.gradle.language.base.plugins.LifecycleBasePlugin.VERIFICATION_GROUP
import static software.coley.gradle.lifecycle.BuildLifecycle.ALL_CLASSES_TASK_NAME
import static software.coley.gradle.lifecycle.TestLifecycle.enableJacoco

plugins {
    id 'jacoco'
    id 'jvm-test-suite'
    id 'bento.project.build-lifecycle'
}

def testSuiteName = 'test'
def jacocoEnabled = enableJacoco(project)
def testTask = tasks.named(testSuiteName, Test)
def testClassesTask = tasks.named('testClasses')
def jacocoTestReportTask = tasks.named('jacocoTestReport', JacocoReport) { reportTask ->
    reportTask.group = VERIFICATION_GROUP
    reportTask.description = 'Generates JaCoCo coverage report for the test task.'
    reportTask.shouldRunAfter(testTask)
    reportTask.reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
def checkTask = tasks.named('check')
def allClassesTask = tasks.named(ALL_CLASSES_TASK_NAME)

def versionCatalog = versionCatalogs.named('libs')

allClassesTask.configure {
    dependsOn(testClassesTask)
}

checkTask.configure {
    dependsOn(testTask)
    if (jacocoEnabled) {
        dependsOn(jacocoTestReportTask)
    }
}
