import static org.gradle.language.base.plugins.LifecycleBasePlugin.VERIFICATION_GROUP

plugins {
    id 'java'
    id 'bento.project.project-convention'
    id 'maven-publish'
}

def bentoConvention = extensions.getByName('bentoConvention')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = bentoConvention.normalizedProjectName.get()

            from components['java']

            pom {
                url.set( 'https://github.com/Col-E/BentoFX')
                inceptionYear.set( '2025')

                licenses {
                    license {
                        name.set( 'MIT')
                        url.set( 'https://spdx.org/licenses/MIT.html')
                    }
                }
                developers {
                    developer {
                        id =  'Col-E'
                        name =  'Matt Coley'
                    }
                    developer {
                        id.set( 'philliplbryant')
                        name.set( 'Phil Bryant')
                    }
                }
                scm {
                    connection.set( 'scm:git:https://github.com/Col-E/BentoFX.git')
                    developerConnection.set( 'scm:git:ssh://github.com/Col-E/BentoFX.git')
                    url.set( 'https://github.com/Col-E/BentoFX')
                }
            }
        }
    }

    repositories {
        mavenLocal()
        maven {
            url = uri(layout.buildDirectory.dir( 'staging-deploy'))
        }
    }
}

/**
 * A version that resolves here can still be one Maven cannot resolve, and
 * nothing in an ordinary build reads the POM we hand to consumers. Reading
 * the generated POM back is the only check that sees what a consumer sees.
 */
def pomTask = tasks.named('generatePomFileForMavenJavaPublication', GenerateMavenPom)
def generatedPom = objects.fileProperty()
generatedPom.fileProvider(pomTask.map { it.destination })

def validatePomVersionsTask = tasks.register('validatePomVersions') {
    description = 'Fails when the generated POM requests a dependency ' +
            'version Maven cannot resolve.'
    group = VERIFICATION_GROUP

    inputs.file(generatedPom).withPropertyName('generatedPom')

    doLast {
        def pomFile = generatedPom.get().asFile
        def malformedVersions = (pomFile.text =~ /<version>([^<]*)<\/version>/)
                .collect { match -> match[1] }
                .findAll { version -> !(version ==~ /[A-Za-z0-9][A-Za-z0-9._+-]*/) }
                .unique()

        if (malformedVersions) {
            throw new GradleException(
                    "$pomFile requests ${malformedVersions.size()} version(s) " +
                            "that are not versions: ${malformedVersions.join(', ')}"
            )
        }
    }
}

tasks.named('check') {
    dependsOn(validatePomVersionsTask)
}
