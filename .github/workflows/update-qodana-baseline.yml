name: Update Qodana Baseline

on:
  workflow_dispatch:
    inputs:
      commit_baseline:
        description: Commit the updated baseline back to the selected branch
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-baseline:
    name: Generate Qodana baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run Qodana without a baseline
        id: qodana
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: |
            --linter qodana-jvm-community
            --within-docker false
          upload-result: false

      - name: Verify Qodana generated SARIF
        shell: bash
        run: |
          SARIF_FILE="${{ runner.temp }}/qodana/results/qodana.sarif.json"

          if [[ ! -f "$SARIF_FILE" ]]; then
            echo "::error::Qodana did not generate $SARIF_FILE"
            exit 1
          fi

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v7
        with:
          name: qodana-baseline
          path: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          if-no-files-found: error
          retention-days: 30

      - name: Copy SARIF into repository
        if: inputs.commit_baseline
        shell: bash
        run: |
          mkdir -p .github/analysis
          cp \
            "${{ runner.temp }}/qodana/results/qodana.sarif.json" \
            ".github/analysis/qodana-baseline.sarif.json"

      - name: Commit updated baseline
        if: inputs.commit_baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/analysis/qodana-baseline.sarif.json

          if git diff --cached --quiet; then
            echo "Qodana baseline is already current."
            exit 0
          fi

          git commit -m "Update Qodana baseline"
          git push origin "HEAD:${{ github.ref_name }}"
