name: Qodana

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  security-events: write

jobs:
  qodana:
    name: Qodana JVM analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      QODANA_ENDPOINT: https://qodana.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Ultimate linter named in qodana.yaml needs a licensed token to run at
      # all. A pull request from a fork gets no secrets, so the token is empty
      # there and the analysis has to be the Community linter or nothing. The
      # secrets context is not available to an `if:`, which is why this reads the
      # token from the environment instead.
      - name: Select linter
        id: linter
        shell: bash
        run: |
          if [ -n "$QODANA_TOKEN" ]; then
            echo 'args=' >> "$GITHUB_OUTPUT"
            echo "::notice::Running the Ultimate linter from qodana.yaml."
          else
            echo 'args=--linter qodana-jvm-community' >> "$GITHUB_OUTPUT"
            echo "::notice::No QODANA_TOKEN available, so falling back to the Community linter."
          fi

      - name: Run Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          args: |
            ${{ steps.linter.outputs.args }}
            --within-docker false
          upload-result: true
      - name: Upload Qodana SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
