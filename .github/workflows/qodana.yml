name: Qodana

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  security-events: write

jobs:
  qodana:
    name: Qodana JVM analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          args: |
            --linter qodana-jvm-community
            --within-docker false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: https://qodana.cloud
      - name: Upload Qodana SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
