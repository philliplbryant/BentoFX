name: CodeQL

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Java analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Buildless analysis: CodeQL extracts the sources directly instead of
      # observing a compile. That skips the JDK setup, the Gradle cache, and the
      # xvfb dance the test job needs - and the project is already compiled twice
      # over by the build and Qodana workflows, so a third pass buys nothing.
      # Switch to build-mode manual with a real ./gradlew build if CodeQL starts
      # reporting extraction errors, which is where buildless usually gives out.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: java-kotlin
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.6
